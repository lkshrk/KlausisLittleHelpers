name: Bug report
description: Something in Klausi's Little Helpers doesn't work as it should
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! You don't need any GitHub or coding knowledge: just fill in what you can, and skip what you don't know.

  - type: dropdown
    id: feature
    attributes:
      label: Which part of the addon?
      options:
        - Writ & Crate Planner
        - Receipt or fill crate macros
        - Turn-in Route
        - RestedXP Quest Sync
        - Soulstone Reminder
        - TustUI Enhanced XP Bar
        - Settings window (/klh)
        - Something else / not sure
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Which game version?
      options:
        - WoW Forever
        - Retail (current expansion)
        - Both
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Addon version
      description: Type /klh in game, the version is at the top of the General tab. The CurseForge or Wago app shows it too. Not sure? Leave it empty.
      placeholder: "e.g. v0.3.1"

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong, in your own words.
      placeholder: "e.g. I clicked Search at the auction house and the window stayed empty."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: "e.g. A list of writs to buy."

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: The steps you took, if you remember them. It's fine if it only happens sometimes.
      placeholder: |
        1. Open the auction house
        2. Click the Writ Planner button
        3. Type 5800 and click Search

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: |
        Did a red Lua error pop up? Copy it here.
        Tip: the free addons **BugSack** and **BugGrabber** collect errors for you. Click the little bug icon on your minimap, find the error that mentions KlausisLittleHelpers, select it all and copy it.
        No error message? Leave this empty.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A picture often helps a lot. You can drag and drop images or paste them right into this box.

  - type: textarea
    id: addons
    attributes:
      label: Other addons that might be involved
      description: Only if you think it matters, e.g. Auctionator, Questie, RestedXP, TomTom, EllesmereUI or another UI addon.
